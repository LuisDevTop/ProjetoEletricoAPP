<header class="hd"><div><h1>🏠 Casa Elétrica</h1><small>Simulador de instalações · NBR 5410</small></div><div class="hb"><button onclick="exportData()" title="Exportar/Importar">💾</button><button onclick="newProj()" title="Novo projeto">🆕</button></div></header>

<script>
let C=28,GW=26,GH=17;const COL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0aa','#a9a','#780','#c70','#08f'];
const T={luz:{n:'Luz',w:100,v:127,ic:'💡'},tug:{n:'Tomada',w:100,v:127,ic:'🔌'},chu:{n:'Chuveiro',w:5500,v:220,ic:'🚿'},ar:{n:'Ar-cond.',w:1400,v:220,ic:'❄️'}};
const KINDS=['Quarto','Sala','Cozinha','Banheiro','Área de serviço','Outro'];
const WMAX={1.5:10,2.5:20,4:25,6:32,10:50},OD={1.5:3,2.5:3.7,4:4.3,6:5,10:6.6},CD={16:12.5,20:16.4,25:21.4,32:27.8};
const S={floors:['Térreo'],fl:0,rooms:[],doors:[],pts:[],circ:[],qd:{x:10,y:9,f:0},idr:false,idrA:40,dps:false,geral:40,mod:24,comb:false,nb:false,pb:false,hastes:0,solo:80,sup:'Bifásica',goal:'',wires:[],wsel:null,hint:false,v3:false,gw:26,gh:17,cell:0,vx:null,vy:0,sel:null,tool:'sel',kind:'Quarto',rname:'',act:null,mode:'plan',nid:1};

const U=.25,$=s=>document.querySelector(s),area=r=>r.w*r.h*U*U,per=r=>2*(r.w+r.h)*U;

const nm=r=>r.n||r.k;
function setMode(m){S.mode=m;render()}
function fbar(){return `<div class="bar"><button class="${S.v3?'on':''}" onclick="S.v3=!S.v3;render()">🧊 Ver em 3D</button> Andar: ${S.floors.map((f,i)=>`<button class="${S.fl==i?'on':''}" onclick="S.fl=${i};S.sel=null;S.cf=0;render()">${f}</button>`).join('')}${S.mode=='plan'?`<button onclick="S.floors.push('Andar '+S.floors.length);S.fl=S.floors.length-1;render()">+ Andar</button>${S.floors.length>1?`<button class="dg" onclick="delFloor()">${S.cf?'⚠ Confirmar exclusão':'🗑 Excluir andar'}</button>`:''}<input type="text" value="${S.floors[S.fl]}" oninput="S.floors[S.fl]=this.value" onchange="render()" title="Renomear andar">`:''}</div>`}
function render(){GW=S.gw;GH=S.gh;C=S.cell||28;const cwid=Math.max(280,Math.min(innerWidth-48,1200)),chgt=Math.round(Math.max(260,Math.min(cwid*.75,innerHeight*.65)));try{localStorage.setItem('qe',JSON.stringify(Object.assign({},S,{sel:null})))}catch(e){}
 $('#tabs').innerHTML=[['plan','<span>🏠</span>Planta'],['circ','<span>🔀</span>Circuitos'],['panel','<span>🔌</span>Quadro'],['uni','<span>📐</span>Unifilar'],['mat','<span>📦</span>Materiais'],['check','<span>✅</span>Teste']].map(([k,n])=>`<button class="${S.mode==k?'on':''}" onclick="setMode('${k}')">${n}</button>`).join('');
 const a=$('#app'),cvh=`<div class="card wrap"><canvas id="cv" width="${S.v3?728:cwid}" height="${S.v3?476:chgt}"></canvas></div>`;
 if(S.mode=='plan'){
  a.innerHTML=`<div class="card">${fbar()}<div class="bar">${[['sel','👆 Selecionar'],['pan','✋ Mover tela'],['room','▭ Cômodo'],['door','🚪 Porta'],['qd','🔲 QD'],['luz','💡'],['tug','🔌'],['chu','🚿'],['ar','❄️'],['del','🗑 Apagar']].map(([k,n])=>`<button class="${S.tool==k?'on':''}" onclick="S.tool='${k}';render()">${n}</button>`).join('')}</div>
  ${S.tool=='room'?`<div class="row">Nome: <input type="text" placeholder="ex.: Escritório do João" value="${S.rname}" oninput="S.rname=this.value"> Tipo (regras): <select onchange="S.kind=this.value">${KINDS.map(k=>`<option ${k==S.kind?'selected':''}>${k}</option>`).join('')}</select></div>`:''}
  <div class="row">🎯 Desafios: <select onchange="loadPreset(this.value)"><option value="">Escolher…</option>${PRE.map((p,i)=>`<option value="${i}">${p.t}</option>`).join('')}</select></div><div class="hint">${S.goal}</div>${S.v3?'':`<div class="row">📐 Área: <input type="number" step="1" min="5" max="200" value="${S.gw*U}" onchange="setArea(+this.value,S.gh*U)"> × <input type="number" step="1" min="5" max="200" value="${S.gh*U}" onchange="setArea(S.gw*U,+this.value)"> m <button onclick="zoomB(.8)">➖</button><button onclick="zoomB(1.25)">➕</button><button onclick="fitCam();draw()">Ajustar</button></div>`}<div id="ef"></div><div class="hint">Cada quadradinho = 25 cm (linha forte = 1 m). Zoom: pinça ou roda · mover a tela: ✋ ou 2 dedos. “Selecionar” edita nome, tipo, medidas e posição; arraste para mover. Portas: clique na parede do cômodo. O QD fica no andar onde você o colocar.</div></div>${cvh}`;
  bind();ef();
 }else if(S.mode=='circ'){
  a.innerHTML=`<div class="card"><div class="hint">Crie circuitos, selecione um e clique nos pontos (em qualquer andar) para ligá‑los.</div>${fbar()}<div class="bar"><button onclick="addCirc()">+ Novo circuito</button><button onclick="autoCirc()">✨ Sugerir circuitos</button><button onclick="S.circ.forEach(autoSize);render()">📐 Auto-dimensionar</button><button onclick="balance()">⚖ Balancear fases</button></div><div id="cl"></div></div>${cvh}`;
  circList();bind();
 }else if(S.mode=='panel'){
  const o=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),ck=(k,t)=>`<label><input type="checkbox" ${S[k]?'checked':''} onchange="S.${k}=this.checked;render()"> ${t}</label>`;
  a.innerHTML=`<div class="card"><div class="row"><label>Alimentação <select onchange="S.sup=this.value;render()">${['Monofásica','Bifásica','Trifásica'].map(v=>`<option ${v==S.sup?'selected':''}>${v}</option>`).join('')}</select></label><span>${phInfo()}</span><button onclick="balance()">⚖ Balancear fases</button></div><b>Gabinete e proteções</b><div class="row"><label>Geral 2P <select onchange="S.geral=+this.value;render()">${o([32,40,50,63,70,100],S.geral)}</select> A</label>
  <label>Gabinete <select onchange="S.mod=+this.value;render()">${o([12,18,24,32,40],S.mod)}</select> módulos</label>${ck('dps','DPS')}${ck('idr','IDR 30 mA')}
  <label>IDR In <select onchange="S.idrA=+this.value;render()">${o([25,40,63,80],S.idrA)}</select> A</label></div>
  <b>Barramentos</b><div class="row">${ck('comb','Pente de fase (63 A)')}${ck('nb','Barramento de neutro')}${ck('pb','Barramento de terra (PE)')}</div>
  <b>Aterramento</b><div class="row"><label>Hastes <input type="number" min="0" max="8" value="${S.hastes}" onchange="S.hastes=+this.value;render()"></label>
  <label>Solo <select onchange="S.solo=+this.value;render()">${[['Úmido',40],['Normal',80],['Seco',200]].map(([n,v])=>`<option value="${v}" ${v==S.solo?'selected':''}>${n}</option>`).join('')}</select></label> ${S.hastes?`R ≈ ${gR().toFixed(0)} Ω`:'<span class="er">sem aterramento!</span>'}</div>
  <div class="card wrap" id="pw"></div></div>
  <div class="card"><b>Circuitos (disjuntores, cabos, eletrodutos)</b><div id="cl"></div></div>`;
  circList();
 pw();}else if(S.mode=='uni')uni();else if(S.mode=='mat')mat();else check();
}
const gR=()=>S.hastes?S.solo/S.hastes*.5:999;
const WS=[1.5,2.5,4,6,10],BKS=[10,16,20,25,32,40,50];
mig(S);try{const sv=localStorage.getItem('qe');if(sv){Object.assign(S,mig(JSON.parse(sv)));S.sel=null}}catch(e){}
const act=()=>({'Monofásica':['R'],'Bifásica':['R','S'],'Trifásica':['R','S','T']}[S.sup]);
function phOpts(c){const a=act();if(c.p==1||a.length==1)return a;return a.length==2?['RS']:['RS','ST','RT']}
function fixPh(c){const o=phOpts(c);if(!o.includes(c.ph))c.ph=o[0]}
function phaseLoads(){const P={R:0,S:0,T:0};S.circ.forEach(c=>{fixPh(c);const I=load(c).I;c.ph.split('').forEach(f=>P[f]+=I)});return P}
function imb(){const P=phaseLoads(),v=act().map(f=>P[f]),m=Math.max(...v);return m?(m-Math.min(...v))/m*100:0}
function phInfo(){const P=phaseLoads();return act().map(f=>f+': '+P[f].toFixed(1)+' A').join(' · ')+' · desequilíbrio '+imb().toFixed(0)+' %'}
function balance(){const P={R:0,S:0,T:0};[...S.circ].sort((a,b)=>load(b).I-load(a).I).forEach(c=>{const I=load(c).I;let best=null,bv=1e9;phOpts(c).forEach(o=>{const m=Math.max(...o.split('').map(f=>P[f]+I));if(m<bv){bv=m;best=o}});c.ph=best;best.split('').forEach(f=>P[f]+=I)});render()}
function autoSize(c){const l=load(c);if(!l.n)return;const lz=l.types.length==1&&l.types[0]=='luz',mW=lz?1.5:l.types.includes('chu')?6:2.5,dv=w=>2*.0172*l.L*l.I/w/l.v*100;
 let wi=WS.indexOf(mW);const bk=BKS.find(b=>b>=l.I)||50;while(wi<4&&WMAX[WS[wi]]<bk)wi++;while(wi<4&&dv(WS[wi])>4)wi++;
 c.wire=WS[wi];c.bk=bk;c.p=l.v==220?2:1;c.c=lz?'B':'C';c.cd=[16,20,25,32].find(d=>3*OD[c.wire]*OD[c.wire]/(CD[d]*CD[d])*100<=40)||32}
function autoCirc(){let li=1,tg=1,te=1;const free=S.pts.filter(p=>!p.c);
 const mk=(n,a)=>{const id=S.nid++,c={id,name:n,bk:10,wire:1.5,p:1,c:'C',cd:20,ph:'R'};a.forEach(p=>p.c=id);S.circ.push(c);autoSize(c);S.act=id};
 const ch=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
 S.floors.forEach((_,f)=>{const q=free.filter(p=>p.f==f),wet=p=>{const r=roomAt(p.x,p.y,f);return r&&(r.k=='Cozinha'||r.k=='Área de serviço')};
  ch(q.filter(p=>p.t=='luz'),8).forEach(a=>mk('ILUM'+li++,a));
  ch(q.filter(p=>p.t=='tug'&&wet(p)),3).forEach(a=>mk('TUG'+tg++,a));
  ch(q.filter(p=>p.t=='tug'&&!wet(p)),8).forEach(a=>mk('TUG'+tg++,a));
  q.filter(p=>p.t=='chu'||p.t=='ar').forEach(p=>mk('TUE'+te++,[p]))});
 balance()}
const PRE=[
{t:'1 · Kitnet 20 m²',goal:'Instale luz e tomadas pela norma, crie os circuitos, monte o quadro com aterramento e chegue a 100 % no teste final.',rooms:[[2,2,10,8,'Quarto','Sala/Quarto'],[12,2,6,6,'Cozinha','Cozinha'],[12,8,5,4,'Banheiro','Banheiro']],doors:[[2,6],[11,4],[12,10]],qd:[11,10]},
{t:'2 · Casa 2 quartos',goal:'Casa térrea com área de serviço: dimensione chuveiro, ar-condicionado e equilibre as fases.',rooms:[[1,1,12,8,'Sala','Sala'],[13,1,8,8,'Cozinha','Cozinha'],[21,1,5,6,'Área de serviço','Lavanderia'],[1,9,8,8,'Quarto','Quarto 1'],[9,9,8,8,'Quarto','Quarto 2'],[17,9,6,6,'Banheiro','Banheiro']],doors:[[1,5],[13,4],[8,12],[16,12],[17,12]],qd:[0,9]},
{t:'3 · Sobrado (2 andares)',goal:'Dois andares: o QD fica no térreo, circuitos do andar superior terão cabo mais longo e queda de tensão maior.',floors:['Térreo','Superior'],rooms:[[1,1,12,8,'Sala','Sala'],[13,1,8,8,'Cozinha','Cozinha'],[1,9,4,4,'Banheiro','Lavabo'],[5,9,6,6,'Área de serviço','Lavanderia'],[1,1,10,8,'Quarto','Suíte',1],[11,1,8,8,'Quarto','Quarto 2',1],[19,1,5,6,'Banheiro','Banheiro',1]],doors:[[1,5],[13,4]],qd:[0,9]}];
function loadPreset(i){if(i==='')return;const p=PRE[i];S.floors=p.floors||['Térreo'];S.fl=0;const o=mig({rooms:p.rooms.map(r=>({x:r[0],y:r[1],w:r[2],h:r[3],k:r[4],n:r[5],f:r[6]||0})),doors:p.doors.map(d=>({x:d[0],y:d[1],f:0})),pts:[],qd:{x:p.qd[0],y:p.qd[1],f:0}});S.rooms=o.rooms;S.doors=o.doors;S.pts=[];S.circ=[];S.qd=o.qd;S.gw=Math.max(S.gw,56);S.gh=Math.max(S.gh,40);S.vx=null;S.cell=0;S.sel=null;S.goal='🎯 '+p.t+': '+p.goal;S.idr=S.dps=S.comb=S.nb=S.pb=false;S.hastes=0;render()}
function exportData(){$('#io').innerHTML=`<div class="card"><textarea id="ta">${JSON.stringify(Object.assign({},S,{sel:null})).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea><div class="row"><button onclick="importData()">📂 Carregar texto</button><button onclick="$('#io').innerHTML=''">Fechar</button></div><div class="hint">Copie o texto para guardar o projeto e cole aqui para restaurar. Ele também é salvo automaticamente neste navegador.</div></div>`}
function importData(){try{Object.assign(S,mig(JSON.parse($('#ta').value)));S.sel=null;$('#io').innerHTML='';render()}catch(e){$('#io').insertAdjacentHTML('beforeend','<div class="er">Texto inválido.</div>')}}
function newProj(){try{localStorage.removeItem('qe')}catch(e){}location.reload()}
const WCOL={F:'#d22',N:'#2060d0',PE:'#2a8a3a'};
const FLC={Quarto:'rgba(190,140,90,.85)',Sala:'rgba(190,140,90,.85)',Cozinha:'rgba(244,242,238,.96)',Banheiro:'rgba(222,236,242,.96)','Área de serviço':'rgba(226,230,233,.96)',Outro:'rgba(210,212,218,.9)'};
function ext(){let w=10,h=10;const m=(x,y)=>{w=Math.max(w,x);h=Math.max(h,y)};S.rooms.forEach(r=>m(r.x+r.w,r.y+r.h));S.pts.concat(S.doors).forEach(p=>m(p.x+1,p.y+1));if(S.qd)m(S.qd.x+1,S.qd.y+1);return[w,h]}
function setArea(w,h){const[ew,eh]=ext();S.gw=Math.max(ew,Math.min(800,Math.round(w/U)||64));S.gh=Math.max(eh,Math.min(800,Math.round(h/U)||40));S.cell=0;S.vx=null;render()}
function mig(o){if(o.u)return o;(o.rooms||[]).forEach(r=>['x','y','w','h'].forEach(c=>r[c]*=2));(o.pts||[]).forEach(p=>{p.x=p.x*2+1;p.y=p.y*2+1});
 o.doors=(o.doors||[]).map(d=>{if(d.o)return d;const dx=d.x*2,dy=d.y*2,r=(o.rooms||[]).find(r=>r.f==d.f&&dx>=r.x&&dx<r.x+r.w&&dy>=r.y&&dy<r.y+r.h);let q={x:dx+1,y:dy+1,o:'h',f:d.f};if(r){if(dy==r.y)q.y=r.y;else if(dy+2==r.y+r.h)q.y=r.y+r.h;else if(dx==r.x){q.o='v';q.x=r.x}else if(dx+2==r.x+r.w){q.o='v';q.x=r.x+r.w}}return q});
 if(o.qd){o.qd.x=o.qd.x*2+1;o.qd.y=o.qd.y*2+1;if(o.qd.f==null)o.qd.f=0}if(o.gw){o.gw*=2;o.gh*=2}o.cell=0;o.vx=null;o.u=1;return o}
const PT=new Map();let pan=null,pend=null;
function camDown(e){PT.set(e.pointerId,[e.clientX,e.clientY]);if(PT.size>=2)pend=null;if(PT.size>=2||(S.tool=='pan'&&S.mode=='plan')||e.button==1||e.button==2){drag=null;pan=1;cv.setPointerCapture(e.pointerId);return true}return false}
function camMove(e){if(!pan||!PT.has(e.pointerId))return false;const o=PT.get(e.pointerId),r=cv.getBoundingClientRect(),k=cv.width/r.width;
 if(PT.size==1){S.vx+=(e.clientX-o[0])*k;S.vy+=(e.clientY-o[1])*k}
 else{const ot=[...PT].find(([id])=>id!=e.pointerId)[1],d0=Math.hypot(o[0]-ot[0],o[1]-ot[1])||1,d1=Math.hypot(e.clientX-ot[0],e.clientY-ot[1]);zoomAt(((e.clientX+ot[0])/2-r.left)*k,((e.clientY+ot[1])/2-r.top)*k,d1/d0);S.vx+=(e.clientX-o[0])/2*k;S.vy+=(e.clientY-o[1])/2*k}
